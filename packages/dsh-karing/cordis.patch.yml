# dsh-karing — 单独调用 Karing 的 DSH 插件
#
# 七个工具：karing_status / karing_start / karing_stop / karing_mode
#           / karing_nodes / karing_search / karing_fetch
- insert:
    - id: karing
      name: '@local/dsh-karing'
      config:
        # Karing 内核可执行文件（Windows 默认安装路径；换机器改这一行）
        exePath: 'F:\Karing\karingService.exe'

        # Karing 的配置目录；留空 = %APPDATA%\karing\karing
        appDataDir: ''

        # 插件运行时目录（配置副本 / 日志 / 状态）；留空 = <插件目录>/data
        dataDir: ''

        # 默认分流模式：rule（内网+国内直连、外网走代理，推荐）/ proxy（全代理）/ direct（全直连）
        mode: 'rule'

        # 国内域名直连（注入 .cn/.com.cn… → direct_out）
        cnBypass: true

        # 内网直连（私有网段与局域网域名 → direct_out）
        lanDirect: true

        # 启动时是否顺带打开 Windows 系统代理（默认 false，只起本地端口更安全）
        systemProxy: false
